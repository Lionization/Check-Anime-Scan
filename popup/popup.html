<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Anime & Scans</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="header">
        <div class="header-banner-container">
            <img src="../assets/promo-banner.png" alt="Check Anime & Scans" class="header-banner-img" width="600" height="338" loading="eager" fetchpriority="high">
        </div>
        <div class="header-bar">
            <div class="header-brand">
                <img src="../icons/favicon48.png" alt="" class="header-icon" width="20" height="20" aria-hidden="true">
                <h1>Nouveautés</h1>
            </div>
            <button id="refresh-btn" class="btn-icon" aria-label="Actualiser les nouveautés" title="Actualiser">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="content">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Rechercher (ex: One Piece...)" autocomplete="off">
        </div>

        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Vérification en cours...</p>
        </div>

        <div id="empty-state" class="hidden">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="empty-icon">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <p>Aucune nouveauté pour le moment.</p>
        </div>

        <div id="columns-container" class="columns-container hidden">
            <div class="column">
                <h2>Animes</h2>
                <ul id="animes-list" class="updates-list" aria-live="polite">
                </ul>
                <p id="animes-empty" class="column-empty hidden">Rien à signaler.</p>
            </div>
            <div class="column">
                <h2>Scans</h2>
                <ul id="scans-list" class="updates-list" aria-live="polite">
                </ul>
                <p id="scans-empty" class="column-empty hidden">Rien à signaler.</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <button id="mark-all-read-btn" class="btn-primary" disabled>Tout marquer comme lu</button>
    </footer>

    <script type="module" src="popup.js"></script>
</body>
</html>
